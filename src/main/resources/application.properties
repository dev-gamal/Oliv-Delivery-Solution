# ===================================================================
# 1. IDENTITÉ DE L'APPLICATION & SERVEUR
# ===================================================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=oliv-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# 2. CONFIGURATION MYSQL (Avec createDatabaseIfNotExist=true)
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# 3. JPA / HIBERNATE
# ===================================================================
# "validate" car c'est Flyway (V1__init_schema_oliv.sql) qui crée les tables.
# (Si vous n'utilisez pas encore Flyway, remplacez "validate" par "update")
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Formatage SQL et gestion explicite du fuseau horaire Maroc (Règle n°9)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca
spring.jackson.time-zone=Africa/Casablanca

# ===================================================================
# 4. MIGRATIONS DE BASE DE DONNÉES (FLYWAY)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# ===================================================================
# 5. STOCKAGE DES PREUVES DE LIVRAISON & PIÈCES KYC (Photos/Signatures)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===================================================================
# 6. PARAMÈTRES MÉTIER & SÉCURITÉ O'LIV (Configurables)
# ===================================================================
# JWT Security
oliv.security.jwt.secret=${JWT_SECRET}
oliv.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Paramètres par défaut du Dispatching (Section 7.3)
oliv.dispatch.default-offer-timeout-seconds=60
oliv.pricing.default-zone=ZONE_PILOTE_MAROC

# ===================================================================
# 7. LOGGING (Développement)
# ===================================================================
logging.level.root=INFO
logging.level.ma.skaii.oliv=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===================================================================
# 8. SWAGGER / OPENAPI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
