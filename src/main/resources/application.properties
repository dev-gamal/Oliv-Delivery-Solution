# ===================================================================
# 1. IDENTITÉ DE L'APPLICATION & SERVEUR
# ===================================================================
spring.application.name=oliv-backend
server.port=8080

# ===================================================================
# 2. CONFIGURATION MYSQL (Avec createDatabaseIfNotExist=true)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/oliv_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Africa/Casablanca&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# 3. JPA / HIBERNATE
# ===================================================================
# "validate" car c'est Flyway (V1__init_schema_oliv.sql) qui crée les tables.
# (Si vous n'utilisez pas encore Flyway, remplacez "validate" par "update")
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Formatage SQL et gestion explicite du fuseau horaire Maroc (Règle n°9)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca
spring.jackson.time-zone=Africa/Casablanca

# ===================================================================
# 4. MIGRATIONS DE BASE DE DONNÉES (FLYWAY)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# ===================================================================
# 5. STOCKAGE DES PREUVES DE LIVRAISON & PIÈCES KYC (Photos/Signatures)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===================================================================
# 6. PARAMÈTRES MÉTIER & SÉCURITÉ O'LIV (Configurables)
# ===================================================================
# JWT Security
oliv.security.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
oliv.security.jwt.expiration-ms=86400000

# Paramètres par défaut du Dispatching (Section 7.3)
oliv.dispatch.default-offer-timeout-seconds=60
oliv.pricing.default-zone=ZONE_PILOTE_MAROC

# ===================================================================
# 7. LOGGING (Développement)
# ===================================================================
logging.level.root=INFO
logging.level.ma.skaii.oliv=DEBUG
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG