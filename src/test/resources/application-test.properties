# ===================================================================
# O'LIV - Profil TEST (H2 en mémoire)
# ===================================================================
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:h2:mem:oliv_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Clé JWT de test (injectée depuis .env ou valeur de test par défaut)
oliv.security.jwt.secret=${JWT_SECRET_TEST:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
oliv.security.jwt.expiration-ms=3600000
oliv.dispatch.default-offer-timeout-seconds=60
