# ===================================================================
# O'LIV - Profil TEST (H2 en mémoire)
# ===================================================================

spring.datasource.url=jdbc:h2:mem:oliv_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# JWT (clé injectée depuis .env)
oliv.security.jwt.secret=${JWT_SECRET_TEST}
oliv.security.jwt.expiration-ms=3600000
oliv.dispatch.default-offer-timeout-seconds=60
